<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stride Ops — Procedural Browser FPS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0e14;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    /* Only the renderer's canvas (a direct child of the container) fills the
       screen. The `> child` selector stops this rule from stretching nested
       HUD canvases (e.g. the minimap) across the whole viewport, which used
       to cover the 3D world behind a full-screen minimap overlay. */
    #game-container > canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    @keyframes fadeUp {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-16px); }
    }
    .hud {
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
</body>
</html>
