# Netlify config for the OVERWATCH game (the default site for this repo).
# The STRIDE OPS demo has its own config in stride-ops/netlify.toml: create a
# second Netlify site with "Base directory" set to `stride-ops` to deploy it.

[build]
  base = "overwatch"
  command = "npm ci && npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
